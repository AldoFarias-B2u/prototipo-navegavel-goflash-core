          fill="#f1f3f7" />

    <!-- "f" (Cinza Médio) -->
    <path d="M 224 0 L 240 0 L 240 16 L 268 16 L 268 32 L 240 32 L 240 110 L 224 110 L 224 32 L 214 32 L 214 16 L 224 16 Z" 
          fill="#70757a" />

    <!-- "l" (Cinza Médio) -->
    <path d="M 282 0 L 298 0 L 298 110 L 282 110 Z" 
          fill="#70757a" />

    <!-- "a" (Cinza Médio) -->
