<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtro para suave profundidade -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ========================================================================
       SÍMBOLO GOFLASH (ESQUERDA)
       ======================================================================== -->
  <g transform="translate(15, 25)" filter="url(#subtleShadow)">
    <!-- Quadrado Arredondado Cinza de Fundo -->
    <rect x="15" y="15" width="130" height="105" rx="30" ry="30" 
          fill="none" stroke="#5a5a5a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bumerangue / Hélice de 3 Pontas Sobreposto em Branco/Prata -->
    <path d="M 108 5 C 113 5 117 9 116 14 C 114 26 107 43 97 58 C 88 71 82 77 75 79 C 73 85 79 97 88 110 C 97 122 108 129 104 134 C 100 138 93 135 84 126 C 71 113 60 97 54 84 C 50 82 43 81 33 82 C 18 84 5 86 3 80 C 1 74 13 68 28 66 C 43 64 53 62 57 56 C 63 46 72 31 82 18 C 92 6 103 5 108 5 Z" 
          fill="#eceff1" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- ========================================================================
       TIPOGRAFIA GEOMÉTRICA "goflash"
       ======================================================================== -->
  <g transform="translate(185, 20)" filter="url(#subtleShadow)">
    
    <!-- "g" (Branco / Prata) -->
