          fill="#70757a" />

    <!-- "h" (Cinza Médio) -->
    <path d="M 548 0 L 564 0 L 564 38 C 572 24 586 16 604 16 C 626 16 638 30 638 52 L 638 110 L 622 110 L 622 56 C 622 40 612 32 596 32 C 578 32 564 44 564 64 L 564 110 L 548 110 Z" 
