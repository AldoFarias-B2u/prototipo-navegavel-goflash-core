<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradientes do símbolo -->
    <linearGradient id="symGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e6ea" />
      <stop offset="100%" stop-color="#b0b8c4" />
    </linearGradient>
    <linearGradient id="symGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#949eaf" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Grupo do Símbolo GoFlash (Hélices Arredondadas Conectadas) -->
  <g filter="url(#subtleGlow)" transform="translate(10, 8)">
    <!-- Asa superior esquerda -->
    <path d="M 32 4 C 18 4 6 16 6 30 C 6 42 16 52 28 54 C 28 44 32 38 40 34 C 44 26 44 14 32 4 Z" fill="url(#symGrad1)" opacity="0.95"/>
    
    <!-- Asa inferior central -->
    <path d="M 32 64 C 44 64 56 54 58 40 C 48 38 40 42 34 34 C 26 40 24 52 32 64 Z" fill="url(#symGrad2)" opacity="0.9"/>
    
    <!-- Asa superior direita -->
    <path d="M 34 6 C 46 8 58 18 60 32 C 60 44 50 56 38 58 C 42 46 38 38 34 32 C 34 22 36 12 34 6 Z" fill="url(#symGrad1)" opacity="0.85"/>
    
    <!-- Centro vazado / forma estilizada -->
    <circle cx="34" cy="34" r="7" fill="#23143d" />
    <circle cx="34" cy="34" r="3.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Tipografia "goflash" -->
  <g filter="url(#subtleGlow)">
    <text x="88" y="52" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="-1.5px" 
          fill="#f1f3f7">
      go<tspan font-weight="400" fill="#ced4da">flash</tspan>
    </text>
  </g>
</svg>
