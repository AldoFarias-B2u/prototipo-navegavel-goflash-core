<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sombra suave para o logo empilhado -->
    <filter id="watermarkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ========================================================================
       SÍMBOLO SUPERIOR CENTRALIZADO
       ======================================================================== -->
  <g transform="translate(160, 20)" filter="url(#watermarkShadow)">
    <!-- Quadrado Arredondado Cinza de Fundo -->
    <rect x="25" y="25" width="150" height="130" rx="34" ry="34" 
          fill="none" stroke="#5a5a5a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bumerangue / Hélice de 3 Pontas Sobreposto em Branco/Prata -->
